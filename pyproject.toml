[project]
name = "frame-apk-push"
version = "0.1.0"
description = "Chromium und WebXR auf Steam Frame einrichten"
requires-python = ">=3.11,<3.15"
dependencies = ["PySide6>=6.8,<7", "paramiko>=3.5,<5", "appdirs>=1.4", "signalslot>=0.2", "zeroconf>=0.140", "websocket-client>=1.8", "androguard>=4.1,<5"]
[project.optional-dependencies]
test = ["pytest>=8", "pytest-qt>=4"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.uv]
package = false
